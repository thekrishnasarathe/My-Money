services:
  # MONEY AI Financial Coach Backend Service
  - type: web
    name: money-ai-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r server/requirements.txt
    startCommand: python server/server.py --port $PORT --host 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
